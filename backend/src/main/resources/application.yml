spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/clinic_system?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  forward-headers-strategy: framework

application:
  ai-server-url: https://duongquockiet0511--clinic-ai-chat-fastapi-app.modal.run
  security:
    jwt:
      secret-key: VGhpc0lzQVN1cGVyU2VjdXJlSldUU2VjcmV0S2V5Rm9yQ2xpbmljU3lzdGVtMTIz
      expiration: 86400000

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: DEBUG
    com.clinic: DEBUG

sepay:
  api-key: ${SEPAY_API_KEY:default_api_key}
  webhook-secret: ${SEPAY_WEBHOOK_SECRET:default_webhook_secret}