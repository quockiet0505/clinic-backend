name: Deploy Backend to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1085023765253/locations/global/workloadIdentityPools/github-pool/providers/github-actions'
          service_account: 'github-deploy-sa@clinicqa-500817.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: 'clinicqa-500817'

      - name: Configure Docker to use Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          cd backend
          docker build -t asia-southeast1-docker.pkg.dev/clinicqa-500817/clinic-artifact/backend:latest .
          docker push asia-southeast1-docker.pkg.dev/clinicqa-500817/clinic-artifact/backend:latest

      - name: Deploy to VM via IAP SSH
        run: |
          # Create necessary directories
          gcloud compute ssh clinic-vm --zone "asia-southeast1-a" --tunnel-through-iap --project "clinicqa-500817" --command "mkdir -p ~/deploy/database ~/deploy/nginx"
          
          # Copy deployment files and database script to VM
          gcloud compute scp --zone "asia-southeast1-a" --tunnel-through-iap --project "clinicqa-500817" deploy/docker-compose.yml clinic-vm:~/deploy/docker-compose.yml
          gcloud compute scp --zone "asia-southeast1-a" --tunnel-through-iap --project "clinicqa-500817" --recurse deploy/nginx/* clinic-vm:~/deploy/nginx/
          gcloud compute scp --zone "asia-southeast1-a" --tunnel-through-iap --project "clinicqa-500817" database/clinic_system.sql clinic-vm:~/deploy/database/clinic_system.sql
          
          # SSH into VM and restart the backend container
          gcloud compute ssh clinic-vm --zone "asia-southeast1-a" --tunnel-through-iap --project "clinicqa-500817" --command "
            # Install Docker if not exists
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker \$USER
            fi
            
            # Navigate to deploy directory
            cd ~/deploy
            
            # Configure Docker Auth on VM to pull from Artifact Registry
            gcloud auth print-access-token | sudo docker login -u oauth2accesstoken --password-stdin https://asia-southeast1-docker.pkg.dev
            
            # Fetch secrets from Secret Manager (nạp vào biến môi trường)
            export DB_PASSWORD=\$(gcloud secrets versions access latest --secret=DB_PASSWORD)
            export JWT_SECRET=\$(gcloud secrets versions access latest --secret=JWT_SECRET)
            
            # Pull new image and restart backend
            sudo DB_PASSWORD="\$DB_PASSWORD" JWT_SECRET="\$JWT_SECRET" docker compose pull backend
            sudo DB_PASSWORD="\$DB_PASSWORD" JWT_SECRET="\$JWT_SECRET" docker compose up -d backend
          "
