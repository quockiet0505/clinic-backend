events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Use Docker's internal DNS resolver to prevent startup crash if backends are not ready
    resolver 127.0.0.11 valid=30s;
    
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # --- RATE LIMITING ZONES ---
    # Zone for general APIs: 10 req/sec per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Zone for Auth endpoints (Login, Register): stricter 2 req/sec per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;


    server {
        listen 80;
        listen 443 ssl;
        server_name api.duongquockiet.id.vn;
        
        # --- STRICTER LIMIT FOR AUTH ---
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429; # Too Many Requests

            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --- STATIC ASSETS (NO RATE LIMIT) ---
        location ~ ^/(uploads|images|icons)/ {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # --- GENERAL LIMIT FOR API ---
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
    
    server {
        listen 80;
        listen 443 ssl;
        server_name admin.duongquockiet.id.vn;
        
        location / {
            set $admin_upstream http://admin-web:80;
            proxy_pass $admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
    
    server {
        listen 80;
        listen 443 ssl;
        server_name patient.duongquockiet.id.vn;
        
        location / {
            set $patient_upstream http://patient-web:80;
            proxy_pass $patient_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
