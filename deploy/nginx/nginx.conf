events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Use Docker's internal DNS resolver to prevent startup crash if backends are not ready
    resolver 127.0.0.11 valid=30s;
    
    server {
        listen 80;
        server_name api.duongquockiet.id.vn;
        
        location / {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
    
    server {
        listen 80;
        server_name admin.duongquockiet.id.vn;
        
        location / {
            set $admin_upstream http://admin-web:80;
            proxy_pass $admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
    
    server {
        listen 80;
        server_name patient.duongquockiet.id.vn;
        
        location / {
            set $patient_upstream http://patient-web:80;
            proxy_pass $patient_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
