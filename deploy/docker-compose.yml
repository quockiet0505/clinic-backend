version: '3.8'

x-logging: &default-logging
  driver: gcplogs
  options:
    gcp-project: "clinicqa-500817"
    gcp-log-cmd: "true"

services:
  mysql-db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: clinic_system
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/clinic_system.sql:/docker-entrypoint-initdb.d/init.sql:ro
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    restart: always

  backend:
    image: asia-southeast1-docker.pkg.dev/clinicqa-500817/clinic-artifact/backend:latest
    environment:
      - "SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/clinic_system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL"
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - APPLICATION_AI_SERVER_URL=https://judiciary-suitably-perpetual.ngrok-free.dev
    depends_on:
      - mysql-db
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
    restart: always

  admin-web:
    image: asia-southeast1-docker.pkg.dev/clinicqa-500817/clinic-artifact/admin-web:latest
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
    restart: always

  patient-web:
    image: asia-southeast1-docker.pkg.dev/clinicqa-500817/clinic-artifact/patient-web:latest
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
    restart: always

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin-web
      - patient-web
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    restart: always

volumes:
  mysql-data:
